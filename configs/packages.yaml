# Dependency catalog for MooriShell
#
# Each entry represents a dependency that MooriShell configures or integrates
# with. Fields:
#   id:            Stable package identifier used in scripts and configs.
#   name:          Human-readable name.
#   source:        Official download source URL.
#   version_policy: pinned | latest | range
#   version:       Pinned version string when policy is "pinned".
#   install_scope: user | machine (installation scope for the package).
#   package_manager: scoop | winget | chocolatey | direct | none
#                    "direct" means download from source URL manually.
#   install_method: package_manager | direct_download | portable
#   category:      shell | terminal | window_manager | status_bar | runtime | other
#   executable:    Expected executable for detection; null until validated.
#   status:        managed | manual (unmanaged until source is validated)
#   artifact_url:  Exact release artifact URL; null when no artifact is approved.
#   checksum:      SHA-256 of the exact artifact; null means installs are blocked.
#
# NOTE: These entries are inventory only. Homepage URLs are not artifacts,
# and no checksum is defined. The bootstrapper must refuse installation until
# each entry has a validated authoritative source and artifact integrity data.

